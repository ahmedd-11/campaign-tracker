<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Campaign Details</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
<div class="container">
    <div class="campaign-header">
        <h1 th:text="${campaign.title}"></h1>

        <form th:action="@{/campaign/{id}/status(id=${campaign.id})}" method="post">
            <label>Status:</label>

            <select name="status">
                <option th:selected="${campaign.status == null or campaign.status.name() == 'TESTING'}">
                    TESTING
                </option>

                <option th:selected="${campaign.status != null and campaign.status.name() == 'SCALING'}">
                    SCALING
                </option>

                <option th:selected="${campaign.status != null and campaign.status.name() == 'KILLED'}">
                    KILLED
                </option>
            </select>

            <button type="submit">Update Status</button>
        </form>

        <form onsubmit="return confirm('Are you sure you want to delete this campaign?')"
              th:action="@{/campaign/{id}/delete(id=${campaign.id})}" method="post">
            <button type="submit">Delete Campaign</button>
        </form>
    </div>
    <h2>Imported Metrics</h2>
    <div class="metrics-grid">
        <p>
            <span class="metric-label">Spend</span>
            <span class="metric-value"
                  th:text="'$' + ${#numbers.formatDecimal(campaign.spend, 1, 2)}">
    </span>
        </p>
        <p>
            <span class="metric-label">CPC</span>
            <span class="metric-value"
                  th:text="'$' + ${#numbers.formatDecimal(campaign.cpc, 1, 2)}">
    </span>
        </p>
        <p>
            <span class="metric-label">CPM</span>
            <span class="metric-value"
                  th:text="'$' + ${#numbers.formatDecimal(campaign.cpm, 1, 2)}">
    </span>
        </p>
        <p>
            <span class="metric-label">Impressions</span>
            <span class="metric-value"
                  th:text="${campaign.impressions}">
    </span>
        </p>

        <p>
            <span class="metric-label">Clicks</span>
            <span class="metric-value"
                  th:text="${campaign.clicks}">
    </span>
        </p>

        <p>
            <span class="metric-label">CTR</span>
            <span class="metric-value"
                  th:text="${#numbers.formatDecimal(campaign.ctr, 1, 2)} + '%'">
    </span>
        </p>

        <p>
            <span class="metric-label">Conversions</span>
            <span class="metric-value"
                  th:text="${campaign.conversions}">
    </span>
        </p>
    </div>
    <h2>Campaign Settings</h2>
    <div class="settings-card">
        <form class="spark-form"
              th:action="@{/campaign/{id}/spark-code(id=${campaign.id})}"
              method="post">

            <label for="sparkCode">Spark Code</label>

            <input type="text"
                   id="sparkCode"
                   name="sparkCode"
                   th:value="${campaign.sparkCode}"
                   autocomplete="off"
                   required>

            <button type="submit">Update Spark Code</button>
        </form>
        <form class="assumptions-form"
              th:action="@{/campaign/{id}/assumptions(id=${campaign.id})}"
              method="post">
            <div class="slider-row">
                <label for="landedRateSlider">Landed Rate</label>

                <input type="range"
                       id="landedRateSlider"
                       name="landedRate"
                       min="0"
                       max="1"
                       step="0.01"
                       th:value="${campaign.landedRate}">

                <span id="landedRateDisplay"
                      th:text="${#numbers.formatDecimal(campaign.landedRate * 100, 1, 0)} + '%'">
    </span>
            </div>

            <div class="slider-row">
                <label for="epcSlider">EPC</label>

                <input type="range"
                       id="epcSlider"
                       name="epc"
                       min="0"
                       max="2"
                       step="0.01"
                       th:value="${campaign.epc}">

                <span id="epcDisplay"
                      th:text="'$' + ${#numbers.formatDecimal(campaign.epc, 1, 2)}">
    </span>
            </div>
            <button type="submit">Update Assumptions</button>
        </form>
    </div>
    <h2>Estimated Results</h2>
    <div class="results-grid">
        <p>
            <span class="metric-label">Landed Clicks</span>
            <span class="metric-value"
                  th:text="${#numbers.formatDecimal(campaign.landedClicks, 1, 2)}">
</span>
        </p>
        <p>
            <span class="metric-label">Estimated Revenue</span>
            <span class="metric-value"
                  th:text="'$' + ${#numbers.formatDecimal(campaign.estimatedRevenue, 1, 2)}">
    </span>
        </p>
        <p>
            <span class="metric-label">Estimated Profit</span>
            <span class="metric-value"
                  th:text="${campaign.estimatedProfit < 0
          ? '-$' + #numbers.formatDecimal(-campaign.estimatedProfit, 1, 2)
          : '$' + #numbers.formatDecimal(campaign.estimatedProfit, 1, 2)}">
</span>
        </p>
        <p>
            <span class="metric-label">ROAS</span>
            <span class="metric-value"
                  th:text="${#numbers.formatDecimal(campaign.roas, 1, 2)} + 'x'">
    </span>
        </p>
    </div>


    <a class="back-button" href="/">Back to Dashboard</a>

    <script>
        const landedRateSlider = document.getElementById("landedRateSlider");
        const landedRateDisplay = document.getElementById("landedRateDisplay");

        const epcSlider = document.getElementById("epcSlider");
        const epcDisplay = document.getElementById("epcDisplay");

        landedRateSlider.addEventListener("input", function () {
            const value = landedRateSlider.value;
            const percentage = value * 100;

            landedRateDisplay.textContent = percentage.toFixed(0) + "%";
        });

        epcSlider.addEventListener("input", function () {
    const value = Number(epcSlider.value);
    epcDisplay.textContent = "$" + value.toFixed(2);
});
    </script>
</div>
</body>
</html>
